# Build blog tĩnh từ Supabase "ditrusip" và đưa lên GitHub Pages (tên miền www.cuocsongdaosip.com, file public/CNAME).
# Chạy khi đẩy code, bấm tay, khi có bài mới (repository_dispatch "content-updated") và mỗi 2 giờ (bài 7:47 giờ Síp, video YouTube tự đồng bộ mỗi giờ).
name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */2 * * *'
    - cron: '55 5,6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.idx.outputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: idx
        name: Danh sách URL mới cho IndexNow (Bing, ChatGPT search)
        env:
          ALL: "${{ contains(github.event.head_commit.message, '[indexnow-all]') && '1' || '0' }}"
        run: |
          grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | sort -u > new.txt
          (curl -fsS https://www.cuocsongdaosip.com/sitemap.xml || true) | grep -o '<loc>[^<]*' | sed 's/<loc>//' | sort -u > old.txt || true
          if [ "$ALL" = 1 ]; then cp new.txt list.txt; else comm -23 new.txt old.txt > list.txt; fi
          echo "Gửi $(wc -l < list.txt) URL"
          echo "urls=$(jq -R . list.txt | jq -sc .)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Báo IndexNow
        if: needs.build.outputs.urls != '' && needs.build.outputs.urls != '[]'
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.urls }}
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"www.cuocsongdaosip.com\",\"key\":\"31e64a6d1b9c974d6eeadf8e486458df\",\"keyLocation\":\"https://www.cuocsongdaosip.com/31e64a6d1b9c974d6eeadf8e486458df.txt\",\"urlList\":$URLS}" -w '\nHTTP %{http_code}\n'
